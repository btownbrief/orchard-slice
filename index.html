<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orchard Slice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1f5c">
<meta name="description" content="Orchard Slice: a fruit-slicing arcade game set in a Vermont apple orchard at golden hour.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orchard Slice">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  --plum:#24163f; --plum2:#3a2460; --cream:#fff3d6; --gold:#ffc94a; --gold2:#ff9f2e; --red:#e0453a; --leaf:#7cc04a; --bark:#4a2a14;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --ui:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1b1233;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--ui);color:var(--cream)}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;touch-action:none}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none;background:#2a1f5c}
#ui{position:absolute;inset:0;pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  opacity:0;transition:opacity .28s ease}
.screen.show{display:flex}
.screen.in{opacity:1}
button{font-family:var(--display);color:inherit;border:0;background:none;cursor:pointer;pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* --- title --- */
#title{justify-content:flex-start}
.logo{width:min(92%,430px);margin-top:clamp(4px,3vh,34px);filter:drop-shadow(0 8px 14px rgba(20,6,40,.55));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px) rotate(-.6deg)}}
.tag{margin-top:2px;font-weight:900;font-size:clamp(12px,3.4vw,15px);letter-spacing:.14em;text-transform:uppercase;color:#ffe3a8;text-shadow:0 2px 0 rgba(36,22,63,.8),0 0 12px rgba(36,22,63,.8)}
.sub{margin-top:3px;font-weight:800;font-size:12px;letter-spacing:.1em;color:#f7b8c8;text-shadow:0 1px 0 rgba(36,22,63,.8),0 0 10px rgba(36,22,63,.8)}
.grow{flex:1}
.left,.right{display:flex;flex-direction:column;align-items:center;width:100%}
.hint{font-family:var(--display);font-size:clamp(17px,5vw,22px);color:#fff;text-shadow:0 2px 0 rgba(36,22,63,.9),0 0 14px rgba(255,200,90,.7);margin-bottom:12px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);opacity:.85}}
.modes{width:min(100%,400px);display:flex;flex-direction:column;gap:10px}
.mode{pointer-events:auto;position:relative;display:flex;align-items:center;justify-content:space-between;text-align:left;border-radius:20px;
  padding:12px 18px;color:var(--cream);background:linear-gradient(180deg,rgba(66,40,104,.94),rgba(36,22,63,.96));
  border:2px solid rgba(255,214,120,.55);box-shadow:0 5px 0 rgba(14,6,30,.85),0 10px 22px rgba(10,4,24,.5);transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(14,6,30,.85),0 3px 8px rgba(10,4,24,.5)}
.mode .mn{font-size:24px;letter-spacing:.04em;line-height:1}
.mode .md{display:block;font-family:var(--ui);font-weight:800;font-size:12px;opacity:.82;margin-top:3px;letter-spacing:.02em}
.mode .mb{font-family:var(--ui);font-weight:900;font-size:12px;color:var(--gold);text-align:right;line-height:1.2}
.mode .mb b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:#fff}
.mode.primary{padding:16px 20px;background:linear-gradient(180deg,#ffd75c,#ff9f2e);color:var(--bark);border-color:#fff2b8;box-shadow:0 6px 0 #a4500f,0 12px 24px rgba(10,4,24,.5)}
.mode.primary:active{box-shadow:0 2px 0 #a4500f,0 4px 8px rgba(10,4,24,.5)}
.mode.primary .mn{font-size:34px}
.mode.primary .md{opacity:.8}
.mode.primary .mb{color:#7a3a0a}.mode.primary .mb b{color:var(--bark)}
.modes .row{display:flex;gap:10px}.modes .row .mode{flex:1;padding:10px 14px}
.modes .row .mn{font-size:21px}
.tg{display:flex;gap:10px;margin-top:12px}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(36,22,63,.85);border:2px solid rgba(255,214,120,.5);
  box-shadow:0 3px 0 rgba(14,6,30,.8)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(14,6,30,.8)}
.ib svg{width:24px;height:24px;fill:none;stroke:var(--cream);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.off svg{opacity:.5}.ib.off::after{content:"";position:absolute;width:30px;height:3px;background:#ff6a5a;border-radius:2px;transform:rotate(-45deg);box-shadow:0 0 0 1px rgba(36,22,63,.9)}
.ib{position:relative}

/* --- pause button (in game) --- */
#pauseBtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:none}
#pauseBtn.show{display:grid}

/* --- cards: pause / over --- */
#pause,#over{justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(36,22,63,.55),rgba(14,6,30,.82));pointer-events:auto}
.card{width:min(100%,380px);text-align:center;padding:22px 20px 20px;border-radius:26px;
  background:linear-gradient(180deg,rgba(74,44,116,.97),rgba(36,22,63,.98));border:2px solid rgba(255,214,120,.6);
  box-shadow:0 8px 0 rgba(14,6,30,.85),0 24px 50px rgba(8,2,20,.6);transform:translateY(14px) scale(.96);transition:transform .32s cubic-bezier(.2,1.4,.4,1)}
.in .card{transform:none}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.03em;color:var(--gold);text-shadow:0 3px 0 rgba(20,8,40,.9)}
.card .why{margin:2px 0 8px;font-weight:800;font-size:14px;opacity:.85}
.big{font-family:var(--display);font-size:78px;line-height:1;color:#fff;text-shadow:0 4px 0 rgba(20,8,40,.9),0 0 22px rgba(255,201,74,.45)}
.newbest{display:inline-block;margin:2px 0 6px;padding:3px 14px;border-radius:99px;font-family:var(--display);font-size:18px;letter-spacing:.08em;color:var(--bark);
  background:linear-gradient(180deg,#ffe27a,#ffa42e);box-shadow:0 3px 0 #a4500f;animation:pulse 1s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stat{background:rgba(14,6,30,.45);border-radius:14px;padding:8px 4px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:#fff}
.stat span{font-weight:900;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#f7c98a}
.btn{display:block;width:100%;margin-top:10px;padding:13px 16px;border-radius:18px;font-size:24px;letter-spacing:.04em;color:var(--cream);
  background:linear-gradient(180deg,rgba(90,58,140,.95),rgba(52,32,88,.95));border:2px solid rgba(255,214,120,.45);box-shadow:0 5px 0 rgba(14,6,30,.85)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(14,6,30,.85)}
.btn.gold{font-size:30px;padding:16px;color:var(--bark);background:linear-gradient(180deg,#ffd75c,#ff9f2e);border-color:#fff2b8;box-shadow:0 6px 0 #a4500f}
.btn.gold:active{box-shadow:0 2px 0 #a4500f}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.small{font-size:18px;padding:9px 12px}
.row2{display:flex;gap:10px}.row2 .btn{margin-top:10px}
.card .tg{justify-content:center;margin-top:14px}

/* --- orchard goals --- */
.goals{margin-top:12px;width:min(100%,340px);text-align:left;background:linear-gradient(180deg,rgba(54,32,90,.86),rgba(30,16,54,.9));
  border:1.5px solid rgba(255,214,120,.5);border-radius:16px;padding:8px 12px 9px;box-shadow:0 4px 0 rgba(14,6,30,.6)}
.gh{display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-size:15px;letter-spacing:.07em;color:var(--gold)}
.gh .rib{display:flex;align-items:center;gap:4px}.gh .rib svg{width:16px;height:19px}.gh .rib b{font-weight:400;color:#fff;font-size:17px}
.gl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;line-height:1.2;margin-top:5px;color:var(--cream)}
.gl i{position:relative;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,214,120,.65);flex:none}
.gl.done i{background:#7cc04a;border-color:#d6f5a0}
.gl.done i::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.gl.done span{opacity:.6;text-decoration:line-through;text-decoration-thickness:2px}
.gl.fresh span{opacity:1;text-decoration:none;color:#d6f5a0}
.gl small{margin-left:auto;font-size:11.5px;color:#f7c98a;white-space:nowrap}
.gl em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:13px;color:var(--bark);background:linear-gradient(180deg,#ffe27a,#ffa42e);padding:1px 8px;border-radius:99px;white-space:nowrap;animation:pulse 1s ease-in-out infinite}
.ovgoals{width:100%;margin:0 0 4px;background:rgba(14,6,30,.4);box-shadow:none;border-color:rgba(255,214,120,.3)}
.close{margin:4px 0 4px;font-weight:900;font-size:14px;color:#f7c98a;letter-spacing:.02em}
@media (max-height:600px){ #tGoals .gl{display:none} #tGoals{padding:6px 12px;margin-top:8px} }
@media (orientation:landscape) and (max-height:520px){ #tGoals,.ovgoals{display:none} }


/* --- daily + blades + next-blade bar --- */
.mode.daily{padding:9px 14px;justify-content:flex-start;gap:10px;background:linear-gradient(180deg,rgba(124,64,40,.95),rgba(70,30,40,.97));border-color:rgba(255,200,110,.7)}
.mode.daily .dl{flex:1}.mode.daily .mn{font-size:20px;color:#ffe27a}
.mode.daily .sun{width:30px;height:30px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe6,#ffd24a 45%,#ff9a2e 75%);box-shadow:0 0 0 3px rgba(255,210,110,.35),0 0 14px rgba(255,190,80,.8)}
.mode.daily .mb small{display:block;font-size:11px;color:#ffb38a;white-space:nowrap}
.mode.daily.done .sun{background:radial-gradient(circle at 40% 38%,#fff,#cfe9a0 50%,#7cc04a 80%);box-shadow:0 0 0 3px rgba(180,240,140,.35)}
.ib.blade{position:relative}.ib.blade span{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #24163f;display:none}
.ib.blade span.on{display:block}
#blades{justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(36,22,63,.6),rgba(14,6,30,.86));pointer-events:auto}
#bladeList{display:flex;flex-direction:column;gap:7px;margin:8px 0 4px;text-align:left}
.bl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(14,6,30,.45);border:2px solid transparent;font-family:var(--ui);font-weight:900;font-size:15px;color:var(--cream);width:100%;text-align:left}
.bl .sw{width:70px;height:16px;flex:none;clip-path:polygon(0 50%,8% 38%,100% 18%,100% 82%,8% 62%);filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
.bl .nm{flex:1}.bl .st{font-family:var(--display);font-weight:400;font-size:15px;color:#f7c98a;white-space:nowrap}
.bl.on{border-color:#ffd24a;background:rgba(255,210,74,.14)}.bl.on .st{color:#ffe27a}
.bl.lock{opacity:.72}.bl.lock .nm{color:#d9c9ef}.bl.peek{border-color:rgba(255,214,120,.6)}.bl.peek .st{color:#ffe27a}
.gn{display:flex;align-items:center;gap:8px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,214,120,.22);font-weight:800;font-size:12px;color:#f7c98a}
.gn span:first-child{flex:none;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gn b{font-weight:900}
.gn .bar{flex:1;height:8px;border-radius:4px;background:rgba(14,6,30,.6);overflow:hidden}.gn .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffd24a,#ff9f2e)}
.gn small{font-size:11.5px;white-space:nowrap}
.gsn{display:block;font-family:var(--ui);font-weight:800;font-size:10.5px;letter-spacing:.02em;color:#b9a6d6;margin-top:-1px}
.gsw{pointer-events:auto;margin-left:auto;flex:none;width:28px;height:28px;margin-top:-5px;margin-bottom:-5px;border-radius:50%;font-family:var(--ui);font-weight:900;font-size:17px;line-height:1;color:#f7c98a;background:rgba(14,6,30,.5);border:1.5px solid rgba(255,214,120,.4)}
.gsw:active{transform:scale(.92)}
.gl small+.gsw{margin-left:6px}
#blades .card{max-height:100%;overflow:auto}
#bladePrev{position:static;display:block;width:100%;height:70px;margin:2px 0 2px;border-radius:14px;background:radial-gradient(ellipse at 50% 60%,rgba(14,6,30,.2),rgba(14,6,30,.55))}
@media (max-height:640px){ #bladePrev{height:46px} }
@media (max-height:640px){ #bladeList{display:grid;grid-template-columns:1fr 1fr;gap:6px} .bl{padding:6px 8px;font-size:13px;gap:7px}.bl .sw{width:34px;height:10px}.bl .st{font-size:12px} #blades .why{font-size:12px;margin:0 0 4px} #blades h2{font-size:28px} #blades .card{width:min(100%,560px);padding:12px 14px} #blades .btn.gold{padding:9px;font-size:22px;margin-top:8px} }
.scorerow{display:flex;align-items:center;justify-content:center;gap:14px}
.grade:empty{display:none}.grade{display:flex;flex-direction:column;align-items:center;line-height:1}
.grade b{font-family:var(--display);font-weight:400;font-size:44px;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;color:#3a1c08;background:radial-gradient(circle at 40% 35%,#fff6c8,#ffd24a 55%,#e08a1e);box-shadow:0 3px 0 #8a4a10,0 0 16px rgba(255,200,80,.5)}
.grade b.gS{background:radial-gradient(circle at 40% 35%,#fff,#ffb3e0 50%,#c84a9a);color:#4a0a30;box-shadow:0 3px 0 #7a1a50,0 0 20px rgba(255,150,220,.7)}
.grade b.gC,.grade b.gD{background:radial-gradient(circle at 40% 35%,#ffe6cc,#d0905a 55%,#8a4a22);color:#3a1a08;box-shadow:0 3px 0 #5a2a10,0 0 12px rgba(220,140,80,.4)}
.grade span{margin-top:5px;font-weight:900;font-size:11px;letter-spacing:.06em;color:#f7c98a;text-transform:uppercase}
@media (orientation:landscape) and (max-height:520px){ .grade b{font-size:30px;width:40px;height:40px} }
.more{margin:-8px 0 10px;font-weight:800;font-size:12.5px;color:#d9c9ef;min-height:0}.more:empty{display:none}
.news{margin:3px 0;font-weight:900;font-size:14px;color:#d6f5a0}
@media (max-height:740px) and (orientation:portrait){ .logo{width:min(70%,320px);margin-top:4px} .sub{display:none} .hint{display:none} .tag{font-size:12px}
  .mode.primary{padding:11px 18px}.mode.primary .mn{font-size:29px} .modes{gap:8px} .modes .row .mode{padding:8px 12px} .tg{margin-top:8px} .ib{width:42px;height:42px} .goals{margin-top:8px} }
@media (max-height:700px){ .mode.daily{padding:6px 12px}.mode.daily .md{display:none}.mode.daily .sun{width:24px;height:24px} }
@media (orientation:landscape) and (max-height:520px){ .mode.daily{padding:5px 12px}.mode.daily .md{display:none}.mode.daily .mn{font-size:17px} }
#toast{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-weight:900;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 1px 4px #000}

/* landscape / short screens: title goes side by side */
@media (orientation:landscape) and (max-height:520px){
  #title{flex-direction:row;flex-wrap:wrap;justify-content:space-around;align-content:center;gap:0 24px}
  #title .left{display:flex;flex-direction:column;align-items:center;width:46%}
  #title .right{display:flex;flex-direction:column;align-items:center;width:46%}
  .logo{width:100%;max-width:340px;margin-top:0}
  .hint{display:none}
  .mode{padding:8px 14px}.mode.primary{padding:10px 16px}.mode.primary .mn{font-size:28px}.mode .mn{font-size:19px}
  .modes{gap:7px}.tg{margin-top:8px}
  .card{padding:12px 16px;width:min(100%,520px)}.card h2{font-size:28px}.big{font-size:52px}.stats{margin:6px 0 8px}.stat b{font-size:20px}
  .btn{padding:8px 12px;font-size:20px;margin-top:6px}.btn.gold{font-size:24px;padding:10px}
  .ovbtns{display:flex;gap:10px}.ovbtns .btn{flex:1}
}
@media (max-height:380px){
  .card{max-height:100%;overflow:auto;padding:10px 16px}.card h2{font-size:26px}.card .why{margin:0 0 4px;font-size:12px}.big{font-size:44px}.stats{margin:4px 0 6px}.stat{padding:4px}.stat b{font-size:18px}.btn{padding:6px 10px;font-size:18px;margin-top:5px}.btn.gold{font-size:22px;padding:8px}.newbest{font-size:14px;margin:0 0 2px}
  .card .tg{margin-top:8px}.ib{width:38px;height:38px}
}
@media (min-width:900px) and (min-height:521px){ .logo{width:min(92%,520px)} }
@media (prefers-reduced-motion:reduce){ .logo,.hint,.newbest{animation:none} }
</style>
</head>
<body>
<div id="safeProbe"></div>
<div id="stage">
  <canvas id="c" aria-label="Orchard Slice game"></canvas>
  <div id="ui">
    <!-- TITLE -->
    <div id="title" class="screen">
      <div class="left">
        <svg class="logo" viewBox="0 0 360 190" role="img" aria-label="Orchard Slice">
          <defs>
            <linearGradient id="lgTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9e6"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
            <linearGradient id="lgSl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a5c"/><stop offset=".55" stop-color="#e0352f"/><stop offset="1" stop-color="#a81426"/></linearGradient>
            <linearGradient id="lgBlade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity=".95"/><stop offset=".75" stop-color="#ffe6a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd270" stop-opacity="0"/></linearGradient>
            <clipPath id="cUp"><polygon points="0,0 360,0 360,78 0,128"/></clipPath>
            <clipPath id="cLo"><polygon points="0,128 360,78 360,190 0,190"/></clipPath>
            <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
          </defs>
          <!-- little leaf + apple -->
          <g transform="translate(180,16)"><path d="M0,10 C-6,-4 8,-12 22,-6 C18,8 6,14 0,10Z" fill="#7cc04a" stroke="#2c6e22" stroke-width="3" stroke-linejoin="round"/><path d="M2,9 C8,4 14,0 20,-4" stroke="#d6f5a0" stroke-width="2" fill="none" stroke-linecap="round"/></g>
          <text x="180" y="62" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="58" letter-spacing="3" fill="none" stroke="#3b1c12" stroke-width="12" stroke-linejoin="round">ORCHARD</text>
          <text x="180" y="62" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="58" letter-spacing="3" fill="url(#lgTop)" stroke="#8a3a1a" stroke-width="1.5" paint-order="stroke">ORCHARD</text>
          <g clip-path="url(#cUp)">
            <text x="180" y="150" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="96" letter-spacing="2" fill="none" stroke="#3b1c12" stroke-width="14" stroke-linejoin="round">SLICE</text>
            <text x="180" y="150" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="96" letter-spacing="2" fill="url(#lgSl)" stroke="#ffb29a" stroke-width="1.5" paint-order="stroke">SLICE</text>
          </g>
          <g clip-path="url(#cLo)" transform="translate(5,7)">
            <text x="180" y="150" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="96" letter-spacing="2" fill="none" stroke="#3b1c12" stroke-width="14" stroke-linejoin="round">SLICE</text>
            <text x="180" y="150" text-anchor="middle" font-family="Lilita One, Arial Rounded MT Bold, sans-serif" font-size="96" letter-spacing="2" fill="url(#lgSl)" stroke="#ffb29a" stroke-width="1.5" paint-order="stroke">SLICE</text>
          </g>
          <line x1="-6" y1="132" x2="366" y2="76" stroke="#ffd270" stroke-width="9" stroke-linecap="round" filter="url(#glow)" opacity=".85"/>
          <line x1="-6" y1="132" x2="366" y2="76" stroke="url(#lgBlade)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="tag">A fruit-slicing arcade game</div>
        <div class="sub">Harvest edition &middot; Burlington, VT</div>
        <div class="goals" id="tGoals"></div>
      </div>
      <div class="grow"></div>
      <div class="right">
        <div class="hint" id="hint">Swipe the fruit!</div>
        <div class="modes">
          <button class="mode primary" data-mode="classic"><span><span class="mn">CLASSIC</span><span class="md">Miss 3 fruit and it's over. Dodge the hives!</span></span><span class="mb">BEST<b id="b-classic">0</b></span></button>
          <div class="row">
            <button class="mode" data-mode="timed"><span><span class="mn">TIMED</span><span class="md">60 seconds</span></span><span class="mb">BEST<b id="b-timed">0</b></span></button>
            <button class="mode" data-mode="zen"><span><span class="mn">ZEN</span><span class="md">90 s, no hives</span></span><span class="mb">BEST<b id="b-zen">0</b></span></button>
          </div>
          <button class="mode daily" data-mode="daily"><span class="sun" aria-hidden="true"></span><span class="dl"><span class="mn">DAILY HARVEST</span><span class="md" id="d-sub">Same orchard for everyone &middot; +1 ribbon</span></span><span class="mb" id="d-best">TODAY<b>0</b></span></button>
        </div>
        <div class="tg" style="justify-content:center">
          <button class="ib blade" id="bBlades" aria-label="Blades"><svg viewBox="0 0 24 24"><path d="M4 20 19 5c1-1 2.4-.4 1.6.9L8.5 19.5"/><path d="M3 21l3-1"/></svg><span id="bladeDot"></span></button>
          <button class="ib" data-tog="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
          <button class="ib" data-tog="mus" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
        </div>
      </div>
    </div>

    <button id="pauseBtn" class="ib" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="3.4"/></svg></button>

    <!-- PAUSE -->
    <div id="pause" class="screen">
      <div class="card">
        <h2>PAUSED</h2>
        <div class="why">Take a breather, the fruit will wait.</div>
        <button class="btn gold" id="bResume">RESUME</button>
        <div class="row2"><button class="btn small" id="bRestart">Restart</button><button class="btn small" id="bQuit">Menu</button></div>
        <div class="tg">
          <button class="ib" data-tog="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
          <button class="ib" data-tog="mus" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg></button>
        </div>
      </div>
    </div>

    <!-- BLADES -->
    <div id="blades" class="screen">
      <div class="card">
        <h2>BLADES</h2>
        <div class="why">Earn ribbons from Orchard Goals and the Daily Harvest to unlock new blades.</div>
        <canvas id="bladePrev" aria-hidden="true"></canvas>
        <div id="bladeList"></div>
        <button class="btn gold" id="bBladesDone">DONE</button>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="over" class="screen">
      <div class="card">
        <h2 id="ovTitle">GAME OVER</h2>
        <div class="why" id="ovWhy"></div>
        <div class="scorerow"><div class="big" id="ovScore">0</div><div class="grade" id="ovGrade"></div></div>
        <div id="ovBest"></div>
        <div class="stats">
          <div class="stat"><b id="ovCombo">0</b><span>Best combo</span></div>
          <div class="stat"><b id="ovFruit">0</b><span>Sliced</span></div>
          <div class="stat"><b id="ovHi">0</b><span id="ovHiLbl">Best</span></div>
        </div>
        <div class="more" id="ovMore"></div>
        <div class="goals ovgoals" id="ovGoals"></div>
        <button class="btn gold" id="bAgain" disabled>SLICE AGAIN</button>
        <div class="row2 ovbtns"><button class="btn small" id="bShare" style="display:none">Share</button><button class="btn small" id="bMenu" disabled>Menu</button></div>
      </div>
    </div>
    <div id="toast"></div>
  </div>
</div>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
